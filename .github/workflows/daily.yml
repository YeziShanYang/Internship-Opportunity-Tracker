name: daily

on:
  # 00:00 America/Los_Angeles -- midnight Pacific, deliberately ~6.5 hours ahead of the
  # 06:30 morning read rather than aimed at it.
  #
  # Aiming at 06:30 does not work. GitHub cron is best-effort (spec section 10.3) and in
  # this repo -- private, free personal account, the worst bucket for scheduler priority
  # -- "best-effort" measured as 3h27m to 4h48m late on every tick observed, plus one
  # tick dropped outright. A 13:30 UTC cron delivered at 17:18 UTC, i.e. 10:18 Pacific.
  # No cron value can fix that, because the delay is unbounded. Headroom can: scheduling
  # at midnight means even the worst delay seen so far still lands before 05:00 Pacific,
  # and a digest that arrives early is fine while one that arrives at lunchtime is not.
  #
  # GitHub cron is UTC-only with no notion of DST, so 07:00 UTC is exactly midnight PDT
  # in summer and 23:00 PST in winter. The winter hour of drift is earlier, which is the
  # harmless direction; note the UTC date is already the new day at 07:00 either way, so
  # the digest is still labelled -- and still counted, for the one-a-day lock -- as the
  # day the owner wakes up into.
  #
  # One tick. There were three -- 07:00, 08:20 and 09:40 -- added on 2026-09-07 after a
  # tick was dropped outright with no run, no log and no notification. Removed
  # 2026-09-15, and the run history is the argument: since the
  # retries landed, all three ticks have fired on all eight days, 24 of 24, with nothing
  # dropped. In every one of those days the *first* tick is the one that delivered, and
  # the 16 retries have delivered zero digests between them. A retry only helps when the
  # first tick is dropped; when the first tick fails for a reason in the code, the
  # retries fail identically, which is exactly what happened on 2026-09-14 and again on
  # 2026-09-15.
  #
  # The drop is still real and this is a real trade. What makes it acceptable is the
  # cadence: exactly one digest a day, every day, so a missing morning is unambiguous
  # rather than "maybe nothing changed" -- silence means broken and the owner sees it the
  # same morning. `workflow_dispatch` recovers the day by hand. If drops resume, the fix
  # is to put these two lines back, not to conclude the code is broken.
  schedule:
    - cron: "0 7 * * *" # 00:00 PDT / 23:00 PST -- midnight Pacific
  workflow_dispatch:

permissions:
  contents: write # commit state back: git is the database
  issues: write # deliver the digest

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Runs took 11-13 minutes before the bulk board sources and the NSF watcher, which
    # add about six minutes of fetching. A run killed at the limit loses its state
    # commit as well as the digest, so the headroom is deliberate.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Headless Chromium for posting pages that render in JavaScript (Workday, Ashby).
      # Allowed to fail: without it those rows are judged on the row alone and HEALTH
      # counts them, which is worse but never worth losing the morning's digest over.
      - name: Install headless browser
        continue-on-error: true
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Check sources and deliver the digest
        env:
          # Fine-grained, read-only, public repos. Lifts the GitHub API limit from 60
          # requests/hour to 5,000.
          GH_PAT: ${{ secrets.GH_PAT }}
          # Both optional, and Anthropic wins when both are set. Without either, the
          # run still works; changes are surfaced unclassified rather than dropped.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # gpt-5-mini on a Microsoft Foundry resource, funded by Azure for Students
          # credit. Claude is unavailable there: Azure grants zero Claude deployment
          # quota to student subscriptions because it is Marketplace-billed.
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          # The resource URL that key belongs to. A variable, not a secret: it is not
          # a credential, it just should not be hardcoded in a public repo.
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The full digest by email (deliver/mail.py). All three optional: unset, the
          # issue alone delivers, as it did before. Secrets rather than variables or
          # code because the repo is public and the addresses are personal.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: python run.py all

      # The xlsx is rebuilt only when the CSVs actually changed. openpyxl output is not
      # byte-stable (zip timestamps), so rebuilding it unconditionally would put a
      # binary diff in every single commit and bury the line-level CSV history that is
      # the whole reason state lives in this repo.
      - name: Commit state
        run: |
          git config user.name "opportunity-tracker"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            python build_xlsx.py
            git add out
            # Timestamps advance on every run, so a commit happens daily whether or not
            # anything upstream moved. The snapshots change only on real content
            # changes, which makes them a precise discriminator -- so say which kind of
            # commit this is and keep `git log` scannable for change days.
            if git diff --cached --quiet -- data/snapshots; then
              git commit -q -m "state: heartbeat $(date -u +%Y-%m-%d) (no upstream changes)"
            else
              git commit -q -m "state: $(date -u +%Y-%m-%d) upstream changes detected"
            fi
            git push
          fi
